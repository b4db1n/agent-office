<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Office</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: transparent;
      color: var(--oc-foreground, CanvasText);
      font-family: var(--oc-font, system-ui, sans-serif);
      font-size: 13px;
      line-height: 1.4;
    }
    html[data-oc-surface="panel"], html[data-oc-surface="panel"] body, html[data-oc-surface="panel"] #root { height: 100%; }
    #root { padding: 10px 12px; }
    html[data-oc-surface="status"] #root { padding: 8px 10px; }

    .ao-shell { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    html[data-oc-surface="panel"] .ao-shell { height: 100%; }

    .ao-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .ao-tab {
      border: 1px solid var(--oc-border);
      background: var(--oc-elevated);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      color: inherit;
      font: inherit;
    }
    .ao-tab[aria-pressed="true"] { background: var(--oc-primary); color: var(--oc-primary-foreground, #fff); border-color: var(--oc-primary); }

    .ao-title { font-size: 15px; font-weight: 650; margin: 0; }
    .ao-sub { color: var(--oc-muted); font-size: 11px; margin: 2px 0 0; word-break: break-all; }

    .ao-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
    .ao-agent {
      border: 1px solid var(--oc-border);
      border-left: 3px solid var(--oc-border);
      background: var(--oc-elevated);
      border-radius: 12px;
      padding: 8px;
      text-align: left;
      color: inherit;
      font: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .ao-agent[data-tone="waiting"] { border-left-color: var(--oc-warning); }
    .ao-agent[data-tone="running"] { border-left-color: var(--oc-info); }
    .ao-agent[data-tone="failed"] { border-left-color: var(--oc-error); }
    .ao-agent[data-tone="ready"] { border-left-color: var(--oc-success); }
    .ao-agent:hover { background: var(--oc-hover); }
    .ao-agent:focus-visible { outline: 2px solid var(--oc-focus); outline-offset: 2px; }
    .ao-agent-name { font-size: 12px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ao-agent-state { font-size: 10px; font-weight: 650; color: var(--oc-muted); white-space: nowrap; }
    .ao-agent[data-tone="waiting"] .ao-agent-state { color: var(--oc-warning-text); }
    .ao-agent[data-tone="running"] .ao-agent-state { color: var(--oc-info-text); }
    .ao-agent[data-tone="failed"] .ao-agent-state { color: var(--oc-error-text); }
    .ao-agent[data-tone="ready"] .ao-agent-state { color: var(--oc-success-text); }
    .ao-agent-detail { font-size: 10.5px; color: var(--oc-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .ao-card { border: 1px solid var(--oc-border); background: var(--oc-elevated); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .ao-field { display: flex; flex-direction: column; gap: 4px; }
    .ao-field label { font-size: 11px; font-weight: 650; color: var(--oc-muted); }
    .ao-input, .ao-textarea, .ao-select {
      border: 1px solid var(--oc-border);
      background: var(--oc-background);
      color: inherit;
      font: inherit;
      border-radius: 8px;
      padding: 6px 8px;
      width: 100%;
    }
    .ao-textarea { min-height: 120px; resize: vertical; font-family: var(--oc-mono, ui-monospace, monospace); font-size: 11.5px; }
    .ao-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .ao-btn {
      border: 1px solid var(--oc-border);
      background: var(--oc-elevated);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      color: inherit;
      font: inherit;
    }
    .ao-btn.primary { background: var(--oc-primary); color: var(--oc-primary-foreground, #fff); border-color: var(--oc-primary); }
    .ao-btn.danger { border-color: var(--oc-error); color: var(--oc-error-text); }
    .ao-empty { color: var(--oc-muted); font-size: 12px; padding: 8px 0; }
    .ao-checklist { display: flex; flex-direction: column; gap: 4px; }
    .ao-check { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .ao-check .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--oc-muted); flex: none; }
    .ao-check.ok .dot { background: var(--oc-success); }
    .ao-pre { background: var(--oc-code-background, var(--oc-elevated)); color: var(--oc-code-foreground, inherit); border: 1px solid var(--oc-border); border-radius: 8px; padding: 8px; font-family: var(--oc-mono, ui-monospace, monospace); font-size: 11px; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow: auto; }
    .ao-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .ao-table th, .ao-table td { border-bottom: 1px solid var(--oc-border); padding: 4px 6px; text-align: left; vertical-align: top; }
    .ao-muted { color: var(--oc-muted); }
    html[data-oc-surface="status"] .ao-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .ao-grid { padding: 16px 10px 12px; border-radius: 12px; background: repeating-linear-gradient(0deg,transparent 0 15px,#795d4015 15px 17px), linear-gradient(#afc7d329 28%,#b8986c40 28%); }
    .ao-avatar { position:relative; display:grid; place-items:center; align-self:center; width:34px; height:26px; margin:3px 0 19px; font:bold 10px monospace; color:#162936; background:#b8dbe7; border:3px solid #364854; border-radius:7px; box-shadow:0 12px 0 -3px #47748c; }
    .ao-avatar::before { content:""; position:absolute; width:5px; height:4px; background:#33444f; left:5px; top:2px; box-shadow:13px 0 #33444f; }
    .ao-avatar::after { content:""; position:absolute; top:32px; width:56px; height:5px; background:#927653; border-bottom:3px solid #70583f; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./main.js"></script>
</body>
</html>
